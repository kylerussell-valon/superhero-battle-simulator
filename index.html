<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#05070f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Superhero Battle Simulator</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05070f; }
      body { font-family: "Chicago", "Geneva", ui-monospace, Menlo, monospace; color: #dfe8ff; }
      canvas { display: block; image-rendering: pixelated; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(120% 90% at 50% 10%, #17224a 0%, #070a16 60%, #04050b 100%);
        z-index: 40; letter-spacing: 0.14em; text-transform: uppercase;
      }
      #boot h1 { font-size: clamp(18px, 3.4vw, 40px); color: #ffe066; text-shadow: 0 2px 0 #a15c00, 0 0 24px #ffb70355; }
      #boot .sub { font-size: 11px; opacity: 0.7; letter-spacing: 0.3em; }
      #boot .bar { width: min(460px, 72vw); height: 12px; border: 2px solid #4a6bd6; background: #0a1130; }
      #boot .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #4a6bd6, #7ff5ff); transition: width 120ms linear; }
      #boot .msg { font-size: 11px; opacity: 0.85; min-height: 14px; }
      #boot.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="boot">
      <h1>Superhero Battle Simulator</h1>
      <div class="sub">sdf destructible metropolis</div>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="msg" id="boot-msg">initializing</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
